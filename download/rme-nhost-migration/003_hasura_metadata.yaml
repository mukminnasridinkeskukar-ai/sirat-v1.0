# ---------------------------------------------------------------
# 3. PERMISSIONS PER ROLE
#    Menggunakan X-Hasura-User-Id session variable dari Nhost Auth
# ---------------------------------------------------------------

# ===================== SUPER_ADMIN =====================
# Akses penuh ke semua tabel
permissions_for_roles:
  # ---------- PATIENTS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: patients
    permissions:
      select:
        filter: { deleted_at: { _is_null: true } }
        columns:
          - id
          - clinic_id
          - rm_number
          - nik_encrypted
          - nik_hash
          - full_name
          - birth_place
          - birth_date
          - gender
          - address
          - phone
          - allergies
          - medical_history
          - emergency_contact
          - emergency_phone
          - blood_type
          - created_at
          - updated_at
          - created_by
      insert:
        check: {}
        columns:
          - clinic_id
          - rm_number
          - nik_encrypted
          - nik_hash
          - full_name
          - birth_place
          - birth_date
          - gender
          - address
          - phone
          - allergies
          - medical_history
          - emergency_contact
          - emergency_phone
          - blood_type
          - created_by
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: { deleted_at: { _is_null: true } }
        columns:
          - full_name
          - birth_place
          - birth_date
          - gender
          - address
          - phone
          - allergies
          - medical_history
          - emergency_contact
          - emergency_phone
          - blood_type

  # ---------- ENCOUNTERS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: encounters
    permissions:
      select:
        filter: { deleted_at: { _is_null: true } }
        allow_aggregations: true
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}

  # ---------- SOAP_NOTES ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: soap_notes
    permissions:
      select:
        filter: { deleted_at: { _is_null: true } }
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}
        columns: '*'   # Super admin bisa update semua kolom

  # ---------- VITAL_SIGNS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: vital_signs
    permissions:
      select:
        filter: { deleted_at: { _is_null: true } }
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}

  # ---------- DIAGNOSES ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
