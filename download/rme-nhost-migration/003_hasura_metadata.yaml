  - !!inc/permission
    role_name: resepsionis_admin
    table:
      schema: public
      name: invoice_items
    permissions:
      select: { filter: {} }
      insert: { check: {} }
      update: { filter: {}, check: {} }

  - !!inc/permission
    role_name: resepsionis_admin
    table:
      schema: public
      name: v_antrian_hari_ini
    permissions:
      select: { filter: {} }

  - !!inc/permission
    role_name: resepsionis_admin
    table:
      schema: public
      name: audit_logs
    permissions:
      select:
        filter: { clinic_id: { _eq: X-Hasura-Clinic-Id } }
        columns:
          - id - user_name - action - table_name
          - record_id - created_at
          # TIDAK bisa lihat old_data/new_data (berisi data sensitif)

  - !!inc/permission
    role_name: resepsionis_admin
    table:
      schema: public
      name: users_profile
    permissions:
      select:
        filter: { deleted_at: { _is_null: true }, clinic_id: { _eq: X-Hasura-Clinic-Id } }

  - !!inc/permission
    role_name: resepsionis_admin
    table:
      schema: public
      name: clinics
    permissions:
      select: { filter: { id: { _eq: X-Hasura-Clinic-Id } } }


  # ===================== DOKTER =====================
  # Bisa select patients di kliniknya
  # Bisa insert/update soap_notes HANYA untuk encounter yang dia periksa
  - !!inc/permission
    role_name: dokter
    table:
      schema: public
      name: patients
    permissions:
      select:
        filter:
          deleted_at: { _is_null: true }
          clinic_id: { _eq: X-Hasura-Clinic-Id }

  - !!inc/permission
    role_name: dokter
    table:
      schema: public
      name: encounters
    permissions:
      select:
        filter:
          deleted_at: { _is_null: true }
          clinic_id: { _eq: X-Hasura-Clinic-Id }
          doctor_id: { _eq: X-Hasura-User-Id }
        allow_aggregations: true
      insert:
        check:
          clinic_id: { _eq: X-Hasura-Clinic-Id }
        set:
          clinic_id: X-Hasura-Clinic-Id
          doctor_id: X-Hasura-User-Id
          created_by: X-Hasura-User-Id
      update:
        filter:
          deleted_at: { _is_null: true }
          clinic_id: { _eq: X-Hasura-Clinic-Id }
          doctor_id: { _eq: X-Hasura-User-Id }
        check: {}

  # SOAP: hanya bisa select + insert/update untuk encounter miliknya
