        check: {}

  # ---------- LAB_RESULTS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: lab_results
    permissions:
      select: { filter: { deleted_at: { _is_null: true } } }
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}

  # ---------- CONSENT_FORMS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: consent_forms
    permissions:
      select: { filter: { deleted_at: { _is_null: true } } }
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}

  # ---------- INVOICES ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: invoices
    permissions:
      select:
        filter: { deleted_at: { _is_null: true } }
        allow_aggregations: true
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}

  # ---------- INVOICE_ITEMS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: invoice_items
    permissions:
      select: { filter: {} }
      insert: { check: {} }
      update: { filter: {} , check: {} }

  # ---------- QUEUES ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: queues
    permissions:
      select:
        filter: { deleted_at: { _is_null: true } }
        allow_aggregations: true
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}

  # ---------- AUDIT_LOGS — HANYA SELECT, TANPA INSERT/UPDATE/DELETE ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: audit_logs
    permissions:
      select:
        filter: {}
        columns:
          - id
          - clinic_id
          - user_id
          - user_name
          - action
          - table_name
          - record_id
          - old_data
          - new_data
          - ip_address
          - user_agent
          - created_at
      # TIDAK ADA insert, update, atau delete

  # ---------- ICD10 (read-only) ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: icd10
    permissions:
      select: { filter: {} }

  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: icd9cm
    permissions:
      select: { filter: {} }

  # ---------- VIEW: ANTRIAN ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: v_antrian_hari_ini
    permissions:
      select: { filter: {} }

  # ---------- USERS_PROFILE ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: users_profile
    permissions:
      select: { filter: { deleted_at: { _is_null: true } } }
      insert: { check: {} }
      update: { filter: { deleted_at: { _is_null: true } }, check: {} }

  # ---------- CLINICS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: clinics
    permissions:
      select: { filter: {} }
      insert: { check: {} }
      update: { filter: {} , check: {} }


  # ===================== RESEPSIONIS_ADMIN =====================
  # Bisa: insert/select/update patients, encounters
  # TIDAK BOLEH: update/insert soap_notes, diagnoses, procedures
  - !!inc/permission
    role_name: resepsionis_admin
    table:
      schema: public
      name: patients
    permissions:
      select:
        filter: { deleted_at: { _is_null: true }, clinic_id: { _eq: X-Hasura-Clinic-Id } }
      insert:
        check: { clinic_id: { _eq: X-Hasura-Clinic-Id } }
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true }, clinic_id: { _eq: X-Hasura-Clinic-Id } }
        check: { clinic_id: { _eq: X-Hasura-Clinic-Id } }
        columns:
          - full_name
          - birth_place
          - birth_date
          - gender
          - address
          - phone
          - blood_type
          - emergency_contact
          - emergency_phone
          # TIDAK termasuk: nik_encrypted, nik_hash, allergies, medical_history

  - !!inc/permission
    role_name: resepsionis_admin
