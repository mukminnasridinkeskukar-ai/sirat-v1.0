        check: {}

  # ---------- PRESCRIPTIONS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: prescriptions
    permissions:
      select: { filter: { deleted_at: { _is_null: true } } }
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          created_by: X-Hasura-User-Id
      update:
        filter: { deleted_at: { _is_null: true } }
        check: {}

  # ---------- PRESCRIPTION_ITEMS ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: prescription_items
    permissions:
      select: { filter: { deleted_at: { _is_null: true } } }
      insert: { check: {} }
      update: { filter: { deleted_at: { _is_null: true } }, check: {} }

  # ---------- MEDICINES ----------
  - !!inc/permission
    role_name: super_admin
    table:
      schema: public
      name: medicines
    permissions:
      select: { filter: { deleted_at: { _is_null: true }, is_active: true } }
      insert:
        check: {}
        set:
