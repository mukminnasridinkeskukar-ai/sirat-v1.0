# ---------------------------------------------------------------
# 4. GRAPHQL SUBSCRIPTIONS
#    View v_antrian_hari_ini di-track untuk realtime
# ---------------------------------------------------------------

# --- Custom types (opsional, untuk FHIR mapping) ---
custom_types:
  scalars: []
  enums: []
  input_objects: []
  objects: []


# ---------------------------------------------------------------
# 5. NHOST AUTH CUSTOM CLAIMS
#    Dikonfigurasi di Nhost Dashboard -> Authentication -> JWT Claims
#    Custom claim name: "x-hasura-allowed-roles"
#    Custom claim name: "x-hasura-default-role"
#    Custom claim name: "x-hasura-user-id"
#    Custom claim name: "x-hasura-clinic-id"
#
#    Struktur JWT claims (di Nhost Auth webhook):
#    {
#      "x-hasura-allowed-roles": ["super_admin", "dokter_pj", "dokter", ...],
#      "x-hasura-default-role": "dokter",
#      "x-hasura-user-id": "uuid-of-user-profile",
#      "x-hasura-clinic-id": "uuid-of-clinic"
#    }
# ---------------------------------------------------------------


# ---------------------------------------------------------------
# 6. ACTIONS (Hasura Actions — untuk Nhost Functions)
# ---------------------------------------------------------------
actions:
  # Generate PDF Resume Medis
  - !!inc/action
    name: generate_resume_medis_pdf
    definition:
      type: mutation
      arguments:
        - name: encounter_id
          type: uuid!
      output_type: jsonb
      handler: https://<your-nhost>.nhost.run/v1/functions/generate-resume-pdf
      permissions:
        - role: super_admin
        - role: dokter_pj
        - role: dokter

  # Bridge ke SATUSEHAT FHIR
  - !!inc/action
    name: send_to_satusehat
    definition:
      type: mutation
      arguments:
        - name: encounter_id
          type: uuid!
      output_type: jsonb
      handler: https://<your-nhost>.nhost.run/v1/functions/satusehat-bridge
      permissions:
        - role: super_admin
        - role: dokter_pj
        - role: dokter

  # Lock SOAP (tanda tangan elektronik)
  - !!inc/action
    name: lock_soap_note
    definition:
      type: mutation
      arguments:
        - name: encounter_id
          type: uuid!
      output_type: jsonb
      handler: https://<your-nhost>.nhost.run/v1/functions/lock-soap
      permissions:
        - role: super_admin
        - role: dokter_pj
        - role: dokter

  # Generate QR Code untuk resep
  - !!inc/action
    name: generate_resep_qr
    definition:
      type: query
      arguments:
        - name: prescription_id
          type: uuid!
      output_type: jsonb
      handler: https://<your-nhost>.nhost.run/v1/functions/generate-qr
      permissions:
        - role: super_admin
        - role: dokter_pj
        - role: dokter
        - role: apoteker

  # Cetak kartu pasien
  - !!inc/action
    name: generate_patient_card
    definition:
      type: query
      arguments:
        - name: patient_id
          type: uuid!
      output_type: jsonb
      handler: https://<your-nhost>.nhost.run/v1/functions/generate-patient-card
      permissions:
        - role: super_admin
        - role: resepsionis_admin
