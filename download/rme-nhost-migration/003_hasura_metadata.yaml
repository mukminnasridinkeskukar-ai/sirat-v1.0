    role_name: dokter
    table:
      schema: public
      name: soap_notes
    permissions:
      select:
        filter:
          deleted_at: { _is_null: true }
      insert:
        check: {}
        set:
          clinic_id: X-Hasura-Clinic-Id
          doctor_id: X-Hasura-User-Id
          created_by: X-Hasura-User-Id
      update:
        filter:
          deleted_at: { _is_null: true }
          created_by: { _eq: X-Hasura-User-Id }
          is_locked: { _eq: false }
        check:
          is_locked: { _eq: false }

  - !!inc/permission
