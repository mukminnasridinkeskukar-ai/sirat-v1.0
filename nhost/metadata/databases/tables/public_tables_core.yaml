    - role: OPERATOR
      permission: { columns: "*", filter: {} }
    - role: VIEWER
      permission: { columns: "*", filter: {} }
  insert_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: [nomor_urut, kode_unit, kode_jenis, tahun, nomor_lengkap, surat_id, created_by] }
    - role: ADMIN
      permission: { check: {}, columns: [nomor_urut, kode_unit, kode_jenis, tahun, nomor_lengkap, surat_id, created_by] }
    - role: VERIFIKATOR
      permission: { check: {}, columns: [nomor_urut, kode_unit, kode_jenis, tahun, nomor_lengkap, surat_id, created_by] }
    - role: PIMPINAN
      permission: { check: {}, columns: [nomor_urut, kode_unit, kode_jenis, tahun, nomor_lengkap, surat_id, created_by] }
