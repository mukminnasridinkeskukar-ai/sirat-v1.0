# ============================================================
# SIRAT — Metadata Hasura: tabel master & pendukung
# Role: SUPERADMIN, ADMIN, VERIFIKATOR, PIMPINAN, OPERATOR, VIEWER, public
# ============================================================

# ---------- UNIT_KERJA ----------
- name:
    schema: public
    name: unit_kerja
  object_relationships:
    - name: parent
      using:
        foreign_key_constraint_on: parent_id
  array_relationships:
    - name: children
      using:
        foreign_key_constraint_on: parent_id
    - name: users
      using:
        foreign_key_constraint_on: unit_kerja_id
  select_permissions:
    - role: SUPERADMIN
      permission: { columns: "*", filter: {} }
    - role: ADMIN
      permission: { columns: "*", filter: {} }
    - role: VERIFIKATOR
      permission: { columns: "*", filter: {} }
    - role: PIMPINAN
      permission: { columns: "*", filter: {} }
    - role: OPERATOR
      permission: { columns: "*", filter: {} }
    - role: VIEWER
      permission: { columns: "*", filter: {} }
    - role: public
      permission:
        columns: [id, kode, nama_unit, jenis_unit]
        filter: {}
  insert_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: [kode, nama_unit, jenis_unit, parent_id, status] }
    - role: ADMIN
      permission: { check: {}, columns: [kode, nama_unit, jenis_unit, parent_id, status] }
  update_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: [nama_unit, jenis_unit, parent_id, status], filter: {} }
    - role: ADMIN
      permission: { check: {}, columns: [nama_unit, jenis_unit, parent_id, status], filter: {} }
  delete_permissions:
    - role: SUPERADMIN
      permission: { filter: {} }

# ---------- USERS (profil) ----------
- name:
    schema: public
    name: users
  object_relationships:
    - name: unit_kerja
      using:
        foreign_key_constraint_on: unit_kerja_id
  select_permissions:
    - role: SUPERADMIN
      permission: { columns: "*", filter: {} }
    - role: ADMIN
      permission: { columns: "*", filter: {} }
    - role: VERIFIKATOR
      permission:
        columns: [id, nama, username, email, role, jabatan, nip, unit_kerja_id, status]
        filter: {}
    - role: PIMPINAN
      permission:
        columns: [id, nama, username, email, role, jabatan, nip, unit_kerja_id, status]
        filter: {}
    - role: OPERATOR
      permission:
        columns: [id, nama, username, email, role, jabatan, unit_kerja_id, status]
        filter: {}
    - role: VIEWER
      permission:
        columns: [id, nama, username, role, jabatan, unit_kerja_id, status]
        filter: {}
  insert_permissions:
    - role: SUPERADMIN
      permission:
        check: {}
        columns: [id, nama, username, email, role, jabatan, nip, unit_kerja_id, status]
    - role: ADMIN
      permission:
        check: {}
        columns: [id, nama, username, email, role, jabatan, nip, unit_kerja_id, status]
    - role: OPERATOR
      permission:
        check: { id: { _eq: X-Hasura-User-Id } }
        columns: [id, nama, username, email]
  update_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: [nama, username, email, role, jabatan, nip, unit_kerja_id, status], filter: {} }
    - role: ADMIN
      permission: { check: {}, columns: [nama, username, email, role, jabatan, nip, unit_kerja_id, status], filter: {} }
    - role: OPERATOR
      permission:
        check: { id: { _eq: X-Hasura-User-Id } }
        columns: [nama, jabatan, nip]
        filter: { id: { _eq: X-Hasura-User-Id } }
  delete_permissions:
    - role: SUPERADMIN
      permission: { filter: {} }

