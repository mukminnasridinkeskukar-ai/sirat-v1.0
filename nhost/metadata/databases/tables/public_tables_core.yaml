# ---------- LAMPIRAN ----------
- name:
    schema: public
    name: lampiran
  select_permissions:
    - role: SUPERADMIN
      permission: { columns: "*", filter: {} }
    - role: ADMIN
      permission: { columns: "*", filter: {} }
    - role: VERIFIKATOR
      permission: { columns: "*", filter: {} }
    - role: PIMPINAN
      permission: { columns: "*", filter: {} }
    - role: OPERATOR
      permission:
        columns: "*"
        filter:
          _or:
            - { uploaded_by: { _eq: X-Hasura-User-Id } }
            - { jenis_surat: { _eq: MASUK } }
    - role: VIEWER
      permission: { columns: "*", filter: {} }
  insert_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: "*" }
    - role: ADMIN
      permission: { check: {}, columns: "*" }
    - role: VERIFIKATOR
      permission: { check: { uploaded_by: { _eq: X-Hasura-User-Id } }, columns: "*" }
    - role: OPERATOR
      permission: { check: { uploaded_by: { _eq: X-Hasura-User-Id } }, columns: "*" }
  delete_permissions:
    - role: SUPERADMIN
      permission: { filter: {} }
    - role: ADMIN
      permission: { filter: {} }

