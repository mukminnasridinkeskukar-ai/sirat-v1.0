    - role: VERIFIKATOR
      permission: { columns: "*", filter: {} }
    - role: PIMPINAN
      permission: { columns: "*", filter: {} }
    - role: OPERATOR
      permission: { columns: "*", filter: {} }
    - role: VIEWER
      permission: { columns: "*", filter: {} }
    - role: public
      permission:
        columns: [id, nama, jabatan]
        filter: {}
  insert_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: [nama, jabatan, nip, unit_kerja_id, status] }
    - role: ADMIN
      permission: { check: {}, columns: [nama, jabatan, nip, unit_kerja_id, status] }
