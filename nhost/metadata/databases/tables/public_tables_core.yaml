# ---------- TEMPLATE_SURAT ----------
- name:
    schema: public
    name: template_surat
  select_permissions:
    - role: SUPERADMIN
      permission: { columns: "*", filter: {} }
    - role: ADMIN
      permission: { columns: "*", filter: {} }
    - role: VERIFIKATOR
      permission: { columns: "*", filter: { status: { _eq: AKTIF } } }
    - role: PIMPINAN
      permission: { columns: "*", filter: { status: { _eq: AKTIF } } }
    - role: OPERATOR
      permission: { columns: "*", filter: { status: { _eq: AKTIF } } }
    - role: VIEWER
      permission: { columns: "*", filter: { status: { _eq: AKTIF } } }
  insert_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: [nama_template, jenis_surat, template_content, fields, status] }
    - role: ADMIN
      permission: { check: {}, columns: [nama_template, jenis_surat, template_content, fields, status] }
  update_permissions:
    - role: SUPERADMIN
      permission: { check: {}, columns: "*", filter: {} }
    - role: ADMIN
      permission: { check: {}, columns: "*", filter: {} }
  delete_permissions:
    - role: SUPERADMIN
      permission: { filter: {} }

